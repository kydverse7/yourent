name: WhatsApp Summary Scheduler

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: whatsapp-summary-scheduler
  cancel-in-progress: false

jobs:
  trigger-production-summary:
    name: Trigger Production Summary
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed daily summary endpoint
        env:
          APP_URL: ${{ secrets.YOURENT_APP_URL }}
          CRON_SECRET: ${{ secrets.WHATSAPP_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing GitHub secret: YOURENT_APP_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret: WHATSAPP_CRON_SECRET"
            exit 1
          fi

          BASE_URL="${APP_URL%/}"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/whatsapp/daily-summary"